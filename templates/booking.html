<!DOCTYPE html>
<html>
<head>
<title>Booking - Jemo Tech</title>

<style>
body{
font-family:Arial;
background:linear-gradient(to right,#0d47a1,#42a5f5);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:white;
padding:30px;
width:400px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#0d47a1;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#08306b;
}
</style>

</head>

<body>

<div class="box">

<h2>Book Service</h2>

<!-- IMPORTANT: form added -->
<form method="POST" action="/booking">

<input type="text" name="name" placeholder="Your Name" required>

<input type="text" name="service" placeholder="Service Needed" required>

<input type="date" name="date" required>

<button type="submit">Book Now</button>

</form>

</div>

</body>
</html>
