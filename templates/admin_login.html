<!DOCTYPE html>
<html>
<head>
<title>Admin Login - Jemo Tech</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}

/* BACKGROUND */
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#0d47a1,#1565c0,#1e88e5,#42a5f5);
background-size:400% 400%;
animation:gradientBG 10s ease infinite;
}

/* ANIMATION */
@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* ADMIN CARD */
.box{
width:360px;
padding:35px;
border-radius:18px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.3);
box-shadow:0 10px 30px rgba(0,0,0,0.3);
color:white;
}

/* TITLE */
.box h2{
text-align:center;
margin-bottom:20px;
font-size:26px;
}

/* INPUTS */
input{
width:100%;
padding:13px;
margin-top:15px;
border:none;
border-radius:10px;
outline:none;
font-size:15px;
transition:0.3s;
}

input:focus{
transform:scale(1.02);
}

/* BUTTON */
button{
width:100%;
padding:13px;
margin-top:20px;
background:#ff9800;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
transition:0.3s;
font-weight:bold;
}

button:hover{
background:#e68900;
transform:translateY(-2px);
}

/* ERROR MESSAGE */
.error{
text-align:center;
margin-top:10px;
color:#ff5252;
font-weight:bold;
}

/* MOBILE */
@media(max-width:450px){
.box{
width:90%;
}
}

</style>
</head>

<body>

<div class="box">

<h2>Admin Login</h2>

<form method="POST">

<input type="text" name="username" placeholder="Admin Username" required>

<input type="password" name="password" placeholder="Admin Password" required>

<button type="submit">Login</button>

</form>

<p class="error">{{ error }}</p>

</div>

</body>
</html>
